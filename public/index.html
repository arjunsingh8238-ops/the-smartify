<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Smartify - Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f7f4ee; color: #333; display: flex; height: 100vh; overflow: hidden; }
        /* Sidebar */
        .sidebar { width: 260px; background: #ffffff; border-right: 1px solid #eae5dd; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
        .logo-area { display: flex; align-items: center; gap: 12px; margin-bottom: 30px; }
        .logo-icon { width: 40px; height: 40px; background: #f5a623; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; font-size: 20px; }
        .logo-text { font-size: 18px; font-weight: 700; color: #1a1a1a; }
        .nav-links { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; color: #666; text-decoration: none; font-size: 14px; font-weight: 500; transition: 0.2s; }
        .nav-item.active { background: #f5a623; color: white; box-shadow: 0 4px 12px rgba(245, 166, 35, 0.3); }
        .nav-item:hover:not(.active) { background: #fcf8f2; color: #333; }
        
        /* Main Content */
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .header h1 { font-size: 24px; color: #1a1a1a; }
        .btn-primary { background: #f5a623; color: white; border: none; padding: 10px 20px; border-radius: 10px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 12px rgba(245, 166, 35, 0.3); }
        
        /* Dashboard Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 16px; border: 1px solid #eae5dd; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .stat-card h3 { font-size: 13px; color: #888; margin-bottom: 8px; font-weight: 500; }
        .stat-card .value { font-size: 22px; font-weight: 700; color: #1a1a1a; }

        /* Shopify Module */
        .card { background: white; padding: 25px; border-radius: 16px; border: 1px solid #eae5dd; max-width: 600px; }
        .card h2 { font-size: 18px; margin-bottom: 10px; color: #1a1a1a; }
        .card p { font-size: 13px; color: #666; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; color: #444; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 12px 16px; border-radius: 10px; border: 1px solid #ddd; outline: none; background: #faf8f5; font-size: 14px; }
        .form-group input:focus { border-color: #f5a623; background: white; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div>
            <div class="logo-area">
                <div class="logo-icon">O</div>
                <div class="logo-text">The Smartify</div>
            </div>
            <div class="nav-links">
                <a href="#" class="nav-item active">🏠 Home</a>
                <a href="#" class="nav-item">📦 New Products</a>
                <a href="#" class="nav-item">⚡ Auto Sync</a>
                <a href="#" class="nav-item">🌐 My Website</a>
                <a href="#" class="nav-item">✨ AI Generator</a>
                <a href="#" class="nav-item">⚙️ Settings</a>
            </div>
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>Hi Arjun 👋</h1>
            <button class="btn-primary">+ Sync Product</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Accounts Connected</h3>
                <div class="value">1 Shopify</div>
            </div>
            <div class="stat-card">
                <h3>Products Synced</h3>
                <div class="value">24 Active</div>
            </div>
            <div class="stat-card">
                <h3>Status</h3>
                <div class="value" style="color: #27ae60;">24/7 Live</div>
            </div>
        </div>

        <div class="card">
            <h2>Shopify Product Source</h2>
            <p>Pull active products, descriptions, prices, and images automatically from your store.</p>
            
            <div class="form-group">
                <label>Store URL</label>
                <input type="text" value="https://the-smartify.myshopify.com" placeholder="your-store.myshopify.com">
            </div>

            <div class="form-group">
                <label>Admin API Access Token</label>
                <input type="password" value="shpat_************************" placeholder="shpat_...">
            </div>

            <button class="btn-primary" style="width: 100%; margin-top: 10px;">Connect & Fetch Products</button>
        </div>
    </div>

</body>
</html>
