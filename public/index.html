<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Smartify - Social Automation Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
    <div class="max-w-7xl mx-auto px-4 py-8">
        <header class="flex justify-between items-center mb-8 border-b border-slate-800 pb-4">
            <div>
                <h1 class="text-3xl font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">The Smartify</h1>
                <p class="text-slate-400 text-sm mt-1">Shopify Product Sync & Meta Social Automation</p>
            </div>
            <button onclick="fetchProducts()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-2.5 rounded-xl font-medium transition shadow-lg shadow-indigo-600/30">
                Sync Shopify Products
            </button>
        </header>

        <div id="status-banner" class="mb-6 hidden p-4 rounded-xl text-sm"></div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-slate-800/50 border border-slate-700/60 p-6 rounded-2xl backdrop-blur">
                <h3 class="text-slate-400 text-sm font-medium">Connected Store</h3>
                <p class="text-xl font-semibold mt-2 text-cyan-400">bucbhq-e5.myshopify.com</p>
            </div>
            <div class="bg-slate-800/50 border border-slate-700/60 p-6 rounded-2xl backdrop-blur">
                <h3 class="text-slate-400 text-sm font-medium">Total Products Synced</h3>
                <p id="product-count" class="text-xl font-semibold mt-2 text-indigo-400">0</p>
            </div>
            <div class="bg-slate-800/50 border border-slate-700/60 p-6 rounded-2xl backdrop-blur">
                <h3 class="text-slate-400 text-sm font-medium">Automation Status</h3>
                <p class="text-xl font-semibold mt-2 text-emerald-400">Active & Ready</p>
            </div>
        </div>

        <section>
            <h2 class="text-xl font-semibold mb-4">Shopify Product Catalog</h2>
            <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="col-span-full text-center py-12 text-slate-500 bg-slate-800/20 rounded-2xl border border-slate-800">
                    Click "Sync Shopify Products" above to load your store items.
                </div>
            </div>
        </section>
    </div>

    <script>
        async function fetchProducts() {
            const grid = document.getElementById('product-grid');
            const countEl = document.getElementById('product-count');
            const banner = document.getElementById('status-banner');
            
            grid.innerHTML = '<div class="col-span-full text-center py-12 text-indigo-400">Syncing products from Shopify...</div>';
            
            try {
                const res = await fetch('/api/products');
                const data = await res.json();
                
                if (data.success) {
                    countEl.textContent = data.count;
                    banner.className = 'mb-6 p-4 rounded-xl text-sm bg-emerald-500/10 border border-emerald-500/20 text-emerald-400';
                    banner.textContent = `Successfully synced ${data.count} products from Shopify!`;
                    banner.classList.remove('hidden');

                    if (data.products.length === 0) {
                        grid.innerHTML = '<div class="col-span-full text-center py-12 text-slate-400">No products found in your Shopify store.</div>';
                        return;
                    }

                    grid.innerHTML = data.products.map(p => `
                        <div class="bg-slate-800 border border-slate-700/80 rounded-2xl overflow-hidden shadow-xl flex flex-col justify-between">
                            <div>
                                <img src="${p.image ? p.image.src : 'https://via.placeholder.com/400'}" alt="${p.title}" class="w-full h-48 object-cover bg-slate-900">
                                <div class="p-5">
                                    <h3 class="font-semibold text-lg text-slate-100 truncate">${p.title}</h3>
                                    <p class="text-slate-400 text-sm mt-1 line-clamp-2">${p.body_html ? p.body_html.replace(/<[^>]*>?/gm, '') : 'No description'}</p>
                                </div>
                            </div>
                            <div class="p-5 pt-0 flex justify-between items-center mt-4">
                                <span class="text-indigo-400 font-bold">$${p.variants?.[0]?.price || '0.00'}</span>
                                <button onclick="postSocial('${p.id}')" class="bg-slate-700 hover:bg-indigo-600 text-white text-sm px-4 py-2 rounded-xl transition">
                                    Auto Post
                                </button>
                            </div>
                        </div>
                    `).join('');
                } else {
                    throw new Error(data.error || 'Failed to fetch');
                }
            } catch (err) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-rose-400">Error: ${err.message}</div>`;
                banner.className = 'mb-6 p-4 rounded-xl text-sm bg-rose-500/10 border border-rose-500/20 text-rose-400';
                banner.textContent = `Sync failed: ${err.message}`;
                banner.classList.remove('hidden');
            }
        }

        async function postSocial(productId) {
            alert(`Triggering automated Meta post for Product ID: ${productId}`);
            await fetch('/api/post-social', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ productId, platform: 'Facebook & Instagram' })
            });
        }
    </script>
</body>
</html>
